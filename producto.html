
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descubre los productos naturales de MUTAURA.">
    <title>Producto | MUTAURA</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="main-header">
        <a href="index.html" class="brand">
            <img src="assets/logo.png" alt="MUTAURA" class="brand-logo">
        </a>

        <nav class="main-nav">
            <a href="index.html">Inicio</a>
            <a href="bienestar.html">Bienestar</a>
            <a href="nosotros.html">Nuestra esencia</a>
            <a href="tienda.html">Tienda</a>
        </nav>
    </header>

    <main id="productPage">

        <div class="product-back">
            <a href="javascript:history.back()">← VOLVER</a>
        </div>

        <section class="product-detail">

            <div class="product-detail-image">
                <img id="productImage" src="" alt="">
            </div>

            <div class="product-detail-content">

                <p class="section-eyebrow" id="productCategory">
                    MUTAURA · CUIDADO NATURAL
                </p>

                <h1 id="productName">Cargando producto...</h1>

                <p class="product-tagline" id="productTagline"></p>

                <div class="hero-divider"></div>

                <p class="product-description" id="productDescription"></p>

                <p class="product-presentation" id="productPresentation"></p>

            </div>

        </section>

        <section class="product-information">

            <article>
                <h2>Beneficios</h2>
                <p id="productBenefits"></p>
            </article>

            <article>
                <h2>Ingredientes</h2>
                <p id="productIngredients"></p>
            </article>

            <article>
                <h2>Modo de uso</h2>
                <p id="productUses"></p>
            </article>

        </section>

    </main>

    <footer class="main-footer">
        <p>© 2026 MUTAURA · Cuidado natural y bienestar.</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/producto.js"></script>

    <script src="js/effects.js"></script>
</body>
</html>
